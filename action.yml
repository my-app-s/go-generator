name: Run go-generator
description: Build and run go-generator static

inputs:
  config:
    description: Path config file
    required: false
    default: 'config.json'
  readme:
    description: Path readme file
    required: false
    default: 'README.md'

runs:
  using: 'composite'
  steps:
    - name: Checkout go-generator Repository
      uses: actions/checkout@v7
      with:
        repository: my-app-s/go-generator
        path: 'temp-generator-source'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.6'
        cache: true

    - name: Build binaries
      shell: bash
      run: |
        cd temp-generator-source
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o go-generator .
        chmod +x go-generator

    - name: Generate static
      shell: bash
      run: |
        cd temp-generator-source
        ./go-generator --config "../${{ inputs.config }}" --readme "../${{ inputs.readme }}"

    - name: Download Tailwind CLI
      shell: bash
      run: |
        cd temp-generator-source/dist
        curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
        chmod +x tailwindcss-linux-x64

    - name: Run compilation style
      shell: bash
      run: |
        cd temp-generator-source
        cd dist
        ./tailwindcss-linux-x64 -i input.css -o ./output.css --minify
        ls -la
        rm input.css
        ls -la
        cd ..
        ls -la
        mv dist ../dist

    - name: Move final dist to root
      shell: bash
      run: |
        ls -la
        ls -la dist
        mv dist ../
        ls -la
